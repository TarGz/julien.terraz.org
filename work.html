---
layout: default
---
<div class="uk-grid" data-uk-grid-margin="">
{% for post in site.categories.work %}
<div class="uk-width-large-1-2 uk-width-medium-1-2 uk-width-small-1-1 uk-row-first">
  <div class="uk-thumbnail uk-overlay-hover" data-uk-modal="{target:'#modal-1'}">
    <figure class="uk-overlay">
    {% if forloop.index <= 2 %}
      {% include responsive-image.html src=post.preview alt=post.title width="800" height="533" priority=true %}
    {% else %}
      {% include responsive-image.html src=post.preview alt=post.title width="800" height="533" %}
    {% endif %}                                          
    <figcaption class="uk-overlay-panel uk-overlay-icon uk-overlay-background uk-overlay-fade"></figcaption>                                            
    <a class="uk-position-cover" href={{ post.url }}></a>
    </figure>
    <div class="uk-thumbnail-caption">{{ post.title }}</div>
  </div>
</div>
{% endfor %}
</div>
