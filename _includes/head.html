{% assign crumbs = page.url | remove:'/index.html' | split: '/'%}
{% for crumb in crumbs offset: 1 %}
  {% if forloop.first %}
    {% assign cat = crumb %}
  {% endif %}
{% endfor %}

<head>
  <title>{{ site.title }} {{ page.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="/css/minimal.css" />

  <script type="application/ld+json">
  [
  {
    "@context": "https://julien.terraz.org/{{ page.url }}",
    "@type": "Person",
    "image": "https://julien.terraz.org/targz.jpg",
    "name": "Julien TERRAZ",
    "url": "https://julien.terraz.org/"
  },
  {% if (cat == 'personnal' or cat == 'work') %}{% if page.title %}{
    "@context": "http://targz.fr{{ page.url }}",
    "@type" : "Article",
    "name" : "{{ page.title }}",
    "url" : "https://julien.terraz.org/{{ page.url }}"
  }{% endif %}{% endif %}
  ]
  </script>
  

  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  {% include meta.html %}
</head>
